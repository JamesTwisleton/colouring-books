  <!-- Sun -->
  <circle cx="680" cy="80" r="52" fill="none" stroke="#222" stroke-width="3.5"/>
  <line x1="680" y1="12" x2="680" y2="2"  stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="680" y1="148" x2="680" y2="158" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="612" y1="80" x2="602" y2="80" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="748" y1="80" x2="758" y2="80" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="632" y1="32" x2="625" y2="25" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="728" y1="128" x2="735" y2="135" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="728" y1="32" x2="735" y2="25" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="632" y1="128" x2="625" y2="135" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

