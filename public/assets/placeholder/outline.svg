  <circle cx="516" cy="289" r="4" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="529" cy="285" r="4" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="541" cy="289" r="4" fill="none" stroke="#222" stroke-width="2"/>

