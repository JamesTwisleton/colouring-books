  <!-- Cockapoo head in left window -->
  <circle cx="346" cy="285" r="52" fill="none" stroke="#222" stroke-width="3.5"/>
  <!-- Left ear -->
  <ellipse cx="300" cy="262" rx="24" ry="36" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Right ear -->
  <ellipse cx="392" cy="262" rx="24" ry="36" fill="none" stroke="#222" stroke-width="3"/>
