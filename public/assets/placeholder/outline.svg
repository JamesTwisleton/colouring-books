  <path d="M316 240 Q326 228 338 238" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M346 232 Q356 220 368 232" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="328" cy="278" r="9" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="364" cy="278" r="9" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="330" cy="277" r="4" fill="#222"/>
  <circle cx="366" cy="277" r="4" fill="#222"/>
  <circle cx="332" cy="274" r="1.5" fill="white"/>
  <circle cx="368" cy="274" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="346" cy="293" r="11" ry="7" fill="none" stroke="#222" stroke-width="2.5"/>
  <!-- Mouth -->
  <path d="M335 302 Q346 313 357 302" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M340 312 Q346 322 352 312" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>

