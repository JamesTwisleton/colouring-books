  <ellipse cx="748" cy="358" rx="14" ry="10" fill="none" stroke="#222" stroke-width="2.5"/>
  <ellipse cx="52" cy="358" rx="14" ry="10" fill="none" stroke="#222" stroke-width="2.5"/>

