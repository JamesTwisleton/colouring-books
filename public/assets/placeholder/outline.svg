  <line x1="50"  y1="458" x2="50"  y2="432" stroke="#222" stroke-width="2"/>
  <circle cx="50"  cy="427" r="7"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="41"  cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="59"  cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="50"  cy="416" r="5"  fill="none" stroke="#222" stroke-width="2"/>

  <line x1="750" y1="458" x2="750" y2="432" stroke="#222" stroke-width="2"/>
  <circle cx="750" cy="427" r="7"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="741" cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="759" cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="750" cy="416" r="5"  fill="none" stroke="#222" stroke-width="2"/>

  <line x1="400" y1="458" x2="400" y2="432" stroke="#222" stroke-width="2"/>
  <circle cx="400" cy="427" r="7"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="391" cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="409" cy="418" r="5"  fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="400" cy="416" r="5"  fill="none" stroke="#222" stroke-width="2"/>
</svg>
