  <line x1="400" y1="310" x2="400" y2="390" stroke="#222" stroke-width="2.5"/>
  <!-- Door handles -->
  <rect x="362" y="350" width="22" height="7" rx="3" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="416" y="350" width="22" height="7" rx="3" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Wheels -->
  <circle cx="170" cy="408" r="50" fill="none" stroke="#222" stroke-width="4"/>
  <circle cx="170" cy="408" r="25" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="170" cy="408" r="6"  fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="630" cy="408" r="50" fill="none" stroke="#222" stroke-width="4"/>
  <circle cx="630" cy="408" r="25" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="630" cy="408" r="6"  fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- Wheel arch details -->
  <path d="M120 390 Q170 370 220 390" fill="none" stroke="#222" stroke-width="2.5"/>
  <path d="M580 390 Q630 370 680 390" fill="none" stroke="#222" stroke-width="2.5"/>

  <!-- Road markings -->
  <line x1="0" y1="458" x2="800" y2="458" stroke="#222" stroke-width="2.5"/>
  <line x1="100" y1="490" x2="200" y2="490" stroke="#222" stroke-width="2.5" stroke-dasharray="16 12"/>
  <line x1="340" y1="490" x2="460" y2="490" stroke="#222" stroke-width="2.5" stroke-dasharray="16 12"/>
  <line x1="600" y1="490" x2="700" y2="490" stroke="#222" stroke-width="2.5" stroke-dasharray="16 12"/>

